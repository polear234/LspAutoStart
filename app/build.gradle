plugins { id 'com.android.application' }
android {
    namespace 'io.polear234.autostart'
    compileSdk 34
    defaultConfig {
        applicationId "io.polear234.autostart"
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "2.7"
    }

    // 签名配置：CI 通过环境变量注入，本地无配置时自动跳过
    signingConfigs {
        release {
            def storePath = System.getenv("KEYSTORE_FILE")
            if (storePath != null && !storePath.isEmpty()) {
                storeFile file(storePath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    // Xposed API 仅用于编译（运行时由 Lsposed 框架提供真实实现）
    compileOnly files('libs/xposed-api-stub.jar')
}
