plugins { id 'com.android.application' }
android {
    namespace 'io.polear234.autostart'
    compileSdk 34
    defaultConfig {
        applicationId "io.polear234.autostart"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "2.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    // Xposed API 仅用于编译（运行时由 Lsposed 框架提供真实实现）
    compileOnly files('libs/xposed-api-stub.jar')
}
