plugins { id 'com.android.application' }
android {
    namespace 'com.example.lspautostart'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.lspautostart"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.lsposed:lsposed-api:1.0.0'
}
